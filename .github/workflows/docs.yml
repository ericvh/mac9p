name: docs

on:
  pull_request:

jobs:
  herzog-mirror-updated:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require HERZOG.md update when README.md changes
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          changed="$(git diff --name-only "$base" "$head")"
          echo "$changed"

          if echo "$changed" | grep -qx "README.md"; then
            if ! echo "$changed" | grep -qx "HERZOG.md"; then
              echo "README.md changed but HERZOG.md was not updated."
              exit 1
            fi
          fi

