name: test

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_kext_tests:
        description: "Run optional kext/codec tests"
        required: false
        default: "false"

jobs:
  test-fskit-core:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: SwiftPM tests (FSKit core)
        run: make test-core

  test-kext-codec:
    runs-on: macos-latest
    if: >
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_kext_tests == 'true') ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'kext-tests'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          clang --version

      - name: Kext/codec tests (optional)
        run: make test-kext

