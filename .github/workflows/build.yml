name: build

on:
  push:
  pull_request:

jobs:
  build-userland:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          clang --version

      - name: Build (userland)
        run: make all

